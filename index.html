<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10131f">
  <title>Simple Calculator</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #10131f;
      color: #f5f6fb;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px 16px;
      background:
        radial-gradient(ellipse at 18% 18%, rgb(101 72 220 / 22%), transparent 38%),
        radial-gradient(ellipse at 82% 84%, rgb(41 169 188 / 13%), transparent 36%),
        #10131f;
    }

    .page {
      width: min(100%, 390px);
    }

    .intro {
      margin: 0 0 20px 4px;
    }

    .eyebrow {
      margin: 0 0 7px;
      color: #a99df7;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.7rem, 6vw, 2.1rem);
      letter-spacing: -0.055em;
    }

    .subtitle {
      margin: 7px 0 0;
      color: #8d91a4;
      font-size: 0.9rem;
    }

    .calculator {
      padding: 19px;
      border: 1px solid rgb(255 255 255 / 9%);
      border-radius: 27px;
      background: linear-gradient(145deg, rgb(36 40 59 / 96%), rgb(24 27 42 / 98%));
      box-shadow: 0 28px 80px rgb(0 0 0 / 42%), inset 0 1px rgb(255 255 255 / 5%);
    }

    .display {
      min-height: 144px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-end;
      overflow: hidden;
      padding: 12px 7px 22px;
      text-align: right;
    }

    .expression {
      width: 100%;
      min-height: 24px;
      overflow: hidden;
      color: #9297ab;
      font-size: 0.95rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .result {
      width: 100%;
      overflow: hidden;
      font-size: clamp(2.5rem, 12vw, 3.65rem);
      font-weight: 500;
      letter-spacing: -0.065em;
      line-height: 1.18;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 11px;
    }

    button {
      min-height: 67px;
      border: 1px solid rgb(255 255 255 / 4%);
      border-radius: 18px;
      background: #303449;
      color: #f4f4fa;
      cursor: pointer;
      font: inherit;
      font-size: 1.28rem;
      font-weight: 550;
      transition: transform 120ms ease, background 120ms ease, box-shadow 120ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    button:hover { background: #3a3f56; }
    button:active { transform: scale(0.95); }
    button:focus-visible { outline: 2px solid #b2a7ff; outline-offset: 3px; }

    .utility {
      background: #41465d;
      color: #d3d5e0;
      font-size: 1rem;
      font-weight: 650;
    }

    .operator {
      background: #39344f;
      color: #c1b6ff;
      font-size: 1.45rem;
    }

    .operator:hover { background: #494263; }

    .equals {
      background: linear-gradient(145deg, #9d8aff, #7963e8);
      color: white;
      box-shadow: 0 8px 22px rgb(121 99 232 / 25%);
      font-size: 1.5rem;
    }

    .equals:hover { background: linear-gradient(145deg, #ad9dff, #8874f1); }

    .zero { grid-column: span 2; }

    .hint {
      margin: 17px 0 0;
      color: #777d91;
      font-size: 0.76rem;
      text-align: center;
    }

    .credit {
      margin: 34px 0 0;
      color: #9297ab;
      font-size: 0.82rem;
      text-align: center;
    }

    .credit-name {
      display: inline-block;
      margin-bottom: 5px;
      background: linear-gradient(90deg, #c1b6ff, #8ee4ed);
      background-clip: text;
      color: transparent;
      font-size: 1.05rem;
      font-weight: 750;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      -webkit-background-clip: text;
    }

    kbd {
      padding: 2px 5px;
      border: 1px solid #3b4054;
      border-radius: 5px;
      color: #a9aec0;
      font: inherit;
      font-size: 0.7rem;
    }

    @media (max-width: 380px) {
      .calculator { padding: 14px; border-radius: 23px; }
      .keys { gap: 8px; }
      button { min-height: 61px; border-radius: 15px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="intro">
      <p class="eyebrow">Everyday tools</p>
      <h1>Simple Calculator</h1>
      <p class="subtitle">A little math, made easy.</p>
    </header>

    <section class="calculator" aria-label="Calculator">
      <div class="display" aria-live="polite" aria-atomic="true">
        <div class="expression" id="expression" aria-label="Expression"></div>
        <div class="result" id="result" aria-label="Display">0</div>
      </div>
      <div class="keys">
        <button class="utility" type="button" data-action="clear" aria-label="Clear all">AC</button>
        <button class="utility" type="button" data-action="delete" aria-label="Delete last digit">DEL</button>
        <button class="utility" type="button" data-action="sign" aria-label="Toggle sign">+/−</button>
        <button class="operator" type="button" data-operator="/" aria-label="Divide">÷</button>

        <button type="button" data-digit="7">7</button>
        <button type="button" data-digit="8">8</button>
        <button type="button" data-digit="9">9</button>
        <button class="operator" type="button" data-operator="*" aria-label="Multiply">×</button>

        <button type="button" data-digit="4">4</button>
        <button type="button" data-digit="5">5</button>
        <button type="button" data-digit="6">6</button>
        <button class="operator" type="button" data-operator="-" aria-label="Subtract">−</button>

        <button type="button" data-digit="1">1</button>
        <button type="button" data-digit="2">2</button>
        <button type="button" data-digit="3">3</button>
        <button class="operator" type="button" data-operator="+" aria-label="Add">+</button>

        <button class="zero" type="button" data-digit="0">0</button>
        <button type="button" data-action="decimal" aria-label="Decimal point">.</button>
        <button class="equals" type="button" data-action="equals" aria-label="Equals">=</button>
      </div>
    </section>
    <p class="hint">Use your keyboard, or tap the buttons above</p>
    <footer class="credit">
      Developed by <span class="credit-name">Arush</span><br>
      B.Tech CSE · 1st Sem
    </footer>
  </main>

  <script>
    const resultDisplay = document.querySelector("#result");
    const expressionDisplay = document.querySelector("#expression");
    const keys = document.querySelector(".keys");

    let displayValue = "0";
    let storedValue = null;
    let pendingOperator = null;
    let shouldStartNewNumber = false;
    let lastOperator = null;
    let lastOperand = null;

    const operatorSymbols = { "+": "+", "-": "−", "*": "×", "/": "÷" };

    function render() {
      resultDisplay.textContent = displayValue;
    }

    function clear() {
      displayValue = "0";
      storedValue = null;
      pendingOperator = null;
      shouldStartNewNumber = false;
      lastOperator = null;
      lastOperand = null;
      expressionDisplay.textContent = "";
      render();
    }

    function enterDigit(digit) {
      if (displayValue === "Error") clear();
      if (shouldStartNewNumber) {
        displayValue = digit;
        shouldStartNewNumber = false;
      } else if (displayValue === "0") {
        displayValue = digit;
      } else if (displayValue === "-0") {
        displayValue = "-" + digit;
      } else if (displayValue.replace("-", "").length < 14) {
        displayValue += digit;
      }
      render();
    }

    function enterDecimal() {
      if (displayValue === "Error") clear();
      if (shouldStartNewNumber) {
        displayValue = "0.";
        shouldStartNewNumber = false;
      } else if (!displayValue.includes(".")) {
        displayValue += ".";
      }
      render();
    }

    function calculate(left, operator, right) {
      switch (operator) {
        case "+": return left + right;
        case "-": return left - right;
        case "*": return left * right;
        case "/": return right === 0 ? null : left / right;
        default: return right;
      }
    }

    function formatNumber(number) {
      if (!Number.isFinite(number)) return "Error";
      const rounded = Number.parseFloat(number.toPrecision(11));
      return String(Object.is(rounded, -0) ? 0 : rounded);
    }

    function chooseOperator(operator) {
      if (displayValue === "Error") return;
      const inputValue = Number(displayValue);

      if (pendingOperator && !shouldStartNewNumber) {
        const computed = calculate(storedValue, pendingOperator, inputValue);
        if (computed === null) {
          displayValue = "Error";
          storedValue = null;
          pendingOperator = null;
          expressionDisplay.textContent = "Cannot divide by zero";
          render();
          return;
        }
        displayValue = formatNumber(computed);
        storedValue = computed;
        render();
      } else {
        storedValue = inputValue;
      }

      pendingOperator = operator;
      shouldStartNewNumber = true;
      lastOperator = null;
      lastOperand = null;
      expressionDisplay.textContent = `${displayValue} ${operatorSymbols[operator]}`;
    }

    function equals() {
      if (displayValue === "Error") return;
      let operator = pendingOperator;
      let left = storedValue;
      let right = Number(displayValue);

      if (!operator) {
        if (!lastOperator || lastOperand === null) return;
        operator = lastOperator;
        left = Number(displayValue);
        right = lastOperand;
      }

      const answer = calculate(left, operator, right);
      if (answer === null) {
        displayValue = "Error";
        expressionDisplay.textContent = "Cannot divide by zero";
        storedValue = null;
        pendingOperator = null;
        shouldStartNewNumber = true;
        render();
        return;
      }

      expressionDisplay.textContent = `${formatNumber(left)} ${operatorSymbols[operator]} ${formatNumber(right)} =`;
      displayValue = formatNumber(answer);
      lastOperator = operator;
      lastOperand = right;
      storedValue = null;
      pendingOperator = null;
      shouldStartNewNumber = true;
      render();
    }

    function deleteLast() {
      if (displayValue === "Error") {
        clear();
        return;
      }
      if (shouldStartNewNumber) return;
      displayValue = displayValue.length <= 1 || (displayValue.length === 2 && displayValue.startsWith("-"))
        ? "0"
        : displayValue.slice(0, -1);
      render();
    }

    function toggleSign() {
      if (displayValue === "Error" || displayValue === "0") return;
      displayValue = displayValue.startsWith("-") ? displayValue.slice(1) : `-${displayValue}`;
      render();
    }

    function handleAction(action) {
      if (action === "clear") clear();
      if (action === "delete") deleteLast();
      if (action === "decimal") enterDecimal();
      if (action === "sign") toggleSign();
      if (action === "equals") equals();
    }

    keys.addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      if (button.dataset.digit !== undefined) enterDigit(button.dataset.digit);
      if (button.dataset.operator) chooseOperator(button.dataset.operator);
      if (button.dataset.action) handleAction(button.dataset.action);
    });

    document.addEventListener("keydown", (event) => {
      if (/^[0-9]$/.test(event.key)) enterDigit(event.key);
      else if (event.key === ".") enterDecimal();
      else if (["+", "-", "*", "/"].includes(event.key)) chooseOperator(event.key);
      else if (event.key === "Enter" || event.key === "=") {
        event.preventDefault();
        equals();
      } else if (event.key === "Backspace") deleteLast();
      else if (event.key === "Escape" || event.key === "Delete") clear();
    });
  </script>
</body>
</html>
